name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          if [ ! -f dist/index.js ]; then
            echo "dist/index.js not found — build failed"
            exit 1
          fi
          echo "Build output verified"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"C0ATM71QJ04\",
              \"text\": \"*CI Failed* — \`Alcohol_Monitoring_Shared\` on \`${{ github.ref_name }}\`\n${{ github.event.head_commit.message }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\n_(Automated message via GitHub Actions)_\"
            }"
